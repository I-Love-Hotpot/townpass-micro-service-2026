server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/pr-preview-links {
        resolver 127.0.0.11 valid=10s;
        set $backend backend;
        proxy_pass http://$backend:3001;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
