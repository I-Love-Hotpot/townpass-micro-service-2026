services:
  database:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - database_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - townpass-db

  adminer:
    image: adminer:latest
    restart: unless-stopped
    expose:
      - 8080
    environment:
      - ADMINER_DEFAULT_SERVER=database
      - ADMINER_DEFAULT_USER=${MYSQL_USER:?Set MYSQL_USER in .env}
      - ADMINER_DEFAULT_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      - ADMINER_DEFAULT_DB_NAME=${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
    networks:
      # - coolify
      - townpass-db
    healthcheck:
      test: ["CMD", "wget", "--spider", "-nv", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  database_prod_data:

networks:
  # coolify:
  #   external: true
  townpass-db:
    external: true
