services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    restart: unless-stopped
    expose:
      - "80"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--spider", "-nv", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - .env
    environment:
      MYSQL_HOST: database
      MYSQL_PORT: 3306
    healthcheck:
      test: ["CMD", "wget", "--spider", "-nv", "http://127.0.0.1:3001/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - townpass-db

networks:
  townpass-db:
    external: true
